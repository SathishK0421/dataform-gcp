steps:
  - name: 'node:18'
    id: 'Install Dependencies'
    entrypoint: bash
    args:
      - -c
      - |
        npm install @dataform/cli@latest

  - name: 'node:18'
    id: 'Compile'
    entrypoint: bash
    args:
      - -c
      - |
        npx @dataform/cli compile --vars='{"env":"dev"}'

  - name: 'node:18'
    id: 'Run Tests'
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace
        find . -name "*.sqlx" -exec grep -l "project\|location\|repository" {} \;
        dataform compile --vars='{"env":"dev"}' 2>&1 | tee compile.log

options:
  logging: CLOUD_LOGGING_ONLY