steps:
  - name: 'node:18'
    id: 'Install Dependencies'
    entrypoint: bash
    secretEnv: ['DATAFORM_CREDENTIALS_JSON']
    args:
      - -c
      - |
        echo "$$DATAFORM_CREDENTIALS_JSON" > /workspace/.df-credentials.json
        cd /workspace
        npm ci
        npx @dataform/cli@3.0.48 install

  - name: 'node:18'
    id: 'Compile'
    entrypoint: bash
    env:
      - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace/.df-credentials.json'
    args:
      - -c
      - |
        cd /workspace
        npx @dataform/cli@3.0.48 compile

  - name: 'node:18'
    id: 'Validate'
    entrypoint: bash
    env:
      - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace/.df-credentials.json'
    args:
      - -c
      - |
        cd /workspace
        npx @dataform/cli@3.0.48 test

availableSecrets:
  secretManager:
    - versionName: projects/50822209723/secrets/df-credentials-sa/versions/latest
      env: DATAFORM_CREDENTIALS_JSON

options:
  logging: CLOUD_LOGGING_ONLY