steps:
  - name: 'node:18'
    id: 'Install Dependencies'
    entrypoint: bash
    args:
      - -c
      - |
        npm install @dataform/cli@latest

  - name: 'node:18'
    id: 'Compile'
    entrypoint: bash
    args:
      - -c
      - |
        npx @dataform/cli compile --vars='{"env":"dev"}'

  - name: 'node:18'
    id: 'Run Tests'
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace
        npx @dataform/cli@^3.0.0-beta run --vars='{"env":"dev"}'

options:
  logging: CLOUD_LOGGING_ONLY