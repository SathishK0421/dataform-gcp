steps:
  - name: 'node:18'
    id: 'Install Dependencies'
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace
        npm ci  # Installs package.json deps
        npx @dataform/cli@latest install  # Dataform project deps

  - name: 'node:18'
    id: 'Compile'
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace
        npx @dataform/cli@latest compile --vars='{"env":"dev"}'

  - name: 'node:18'
    id: 'Validate'  # Changed from Run Tests
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace
        npx @dataform/cli@latest test --vars='{"env":"dev"}'  # Local tests only

options:
  logging: CLOUD_LOGGING_ONLY
