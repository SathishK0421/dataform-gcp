steps:
  - name: 'node:18'
    id: 'Install Dependencies'
    entrypoint: bash
    args:
      - -c
      - |
        npm install

  - name: 'node:18'
    id: 'Compile'
    entrypoint: bash
    args:
      - -c
      - |
        npx @dataform/cli compile --vars='{"env":"dev"}'

  - name: 'node:18'
    id: 'Run Tests'
    entrypoint: bash
    args:
      - -c
      - |
        npx @dataform/cli test --vars='{"env":"dev"}' --use-default-credentials

options:
  logging: CLOUD_LOGGING_ONLY